name: Python package

on: [push]

jobs:
  build1:
    
    
    environment: appcreds
    
    run: |
        if [ -n "$DATABASE_PORT" ]; then
          echo "DATABASE_PORT is set"
        else
        echo "DATABASE_PORT is EMPTY"
        fi

        if [ -n "$ACCESS_TOKEN_EXPIRE_MINUTES" ]; then
          echo "ACCESS_TOKEN_EXPIRE_MINUTES is set"
        else
          echo "ACCESS_TOKEN_EXPIRE_MINUTES is EMPTY"
        fi
    env: 
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      DATABASE_HOSTNAME: ${{secrets.DATABASE_HOSTNAME}}
      DATABASE_PORT: ${{secrets.DATABASE_PORT}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        # This is the version of the action for setting up Python, not the Python version.
        uses: actions/setup-python@v5
        with:
          # Semantic version range syntax or exact version of a Python version
          python-version: '3.12'
          # Optional - x64 or x86 architecture, defaults to x64
          architecture: 'x64'
      - name:  update pip
        run: python -m pip install --upgrade pip
      - name: install dependcies
        run: pip install -r requirements.txt
      - name: test with pytest 
        run: |
          pip install pytest
          pytest -v 

